name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: AleMine
          path: build/libs/alemine-*.jar
      - name: Release "latest" aktualisieren (einfacher Download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/alemine-*.jar | grep -v sources | head -1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "AleMine (neuester Build)" --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Die .jar in .minecraft/mods legen (Fabric 26.3 + Fabric API)."
